<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家庭派工看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --paper:#F5F2EA;
    --surface:#FFFFFF;
    --surface-2:#ECE6D8;
    --ink:#1E1B16;
    --ink-soft:#6B6255;
    --line:#DDD4C2;
    --accent:#0E6E64;
    --accent-ink:#FFFFFF;
    --flag:#B96A22;
    --danger:#B23A2E;
    --danger-bg:#F7E3DF;
    --success:#3F7A34;
    --success-bg:#E6EEDF;
    --shadow: 0 1px 2px rgba(30,27,22,.06), 0 4px 14px rgba(30,27,22,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15171A;
      --surface:#1D2023;
      --surface-2:#262A2E;
      --ink:#F0EDE4;
      --ink-soft:#A9A296;
      --line:#34383C;
      --accent:#3FADA0;
      --accent-ink:#0B1210;
      --flag:#E3A542;
      --danger:#E2685A;
      --danger-bg:#3A211D;
      --success:#7CB56A;
      --success-bg:#23301F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#15171A;
    --surface:#1D2023;
    --surface-2:#262A2E;
    --ink:#F0EDE4;
    --ink-soft:#A9A296;
    --line:#34383C;
    --accent:#3FADA0;
    --accent-ink:#0B1210;
    --flag:#E3A542;
    --danger:#E2685A;
    --danger-bg:#3A211D;
    --success:#7CB56A;
    --success-bg:#23301F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums; }
  .display{ font-family:"Big Shoulders Display","Noto Sans TC",sans-serif; }

  a{ color:var(--accent); }
  button{ font:inherit; color:inherit; }
  input,select{ font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  input:focus-visible, select:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  input:disabled, select:disabled{ opacity:.55; background:var(--surface-2); cursor:not-allowed; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    background:var(--surface);
    flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; margin-right:auto; }
  .brand-mark{ font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:22px; letter-spacing:.02em; line-height:1; }
  .brand-sub{ font-size:11px; color:var(--ink-soft); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
  .clock{ font-size:20px; font-weight:600; letter-spacing:.03em; color:var(--flag); }
  .persona-switch{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .persona-btn{ border:0; background:var(--surface); padding:7px 16px; cursor:pointer; font-size:14px; }
  .persona-btn[data-active="1"]{ background:var(--accent); color:var(--accent-ink); font-weight:600; }
  .view-badge{ font-size:12px; font-weight:700; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:5px 12px; }
  .logout-btn{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 14px; cursor:pointer; font-size:13px; color:var(--ink-soft); }
  .logout-btn:hover{ background:var(--surface-2); color:var(--ink); }

  /* ---------- nav tabs ---------- */
  .tabs{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:10px 18px; background:var(--surface-2); border-bottom:1px solid var(--line);
  }
  .tab-btn{
    border:1px solid var(--line); background:var(--surface); border-radius:999px;
    padding:7px 15px; font-size:14px; cursor:pointer; white-space:nowrap;
  }
  .tab-btn[data-active="1"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:600; }
  .tabs input[type="date"]{ margin-left:auto; }

  main{ padding:18px; max-width:980px; margin:0 auto; }
  main.kanban-active{ max-width:none; padding:0; }
  .topbar[hidden], .tabs[hidden]{ display:none!important; }

  .day-heading{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    margin:0 -18px 16px; padding:12px 18px 10px;
    border-bottom:1px solid var(--line);
  }
  .day-heading h1{ font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:30px; margin:0; }
  .day-heading .wk{ color:var(--ink-soft); font-size:15px; }
  .day-heading.not-today{ background:var(--danger-bg); border-bottom-color:var(--danger); }
  .not-today-badge{
    font-size:12px; font-weight:700; color:var(--danger); background:var(--surface);
    border:1px solid var(--danger); border-radius:999px; padding:4px 10px; margin-left:auto;
  }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:700px){ .grid{ grid-template-columns:1fr; } }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line);
  }
  .card-tag{
    font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .card-body{ padding:12px 14px; display:flex; flex-direction:column; gap:10px; }

  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row .who{ font-weight:700; min-width:44px; flex-shrink:0; }
  .row input[type="time"]{ width:128px; }
  .row input.note{ flex:1; min-width:100px; }
  .row select{ min-width:76px; }
  .sep{ color:var(--ink-soft); }

  .iconbtn{
    border:1px solid var(--line); background:var(--surface); border-radius:6px;
    width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:14px; flex-shrink:0;
  }
  .iconbtn:hover{ background:var(--surface-2); }
  .addbtn{
    align-self:flex-start; border:1px dashed var(--line); background:transparent;
    border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; color:var(--accent); font-weight:600;
  }
  .addbtn:hover{ background:var(--surface-2); }
  .confirmbtn{
    align-self:flex-start; border:1px solid var(--accent); background:var(--accent);
    color:var(--accent-ink); border-radius:8px; padding:7px 14px; cursor:pointer; font-size:13px; font-weight:700;
  }
  .confirmbtn:hover{ opacity:.9; }

  .vrow{ border:1px solid var(--line); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .vrow.conflict{ border-color:var(--danger); background:var(--danger-bg); }
  .vrow.derived{ border-style:dashed; background:var(--surface-2); }
  .vrow.derived.conflict{ border-style:solid; background:var(--danger-bg); }
  .vrow.saved{ border-style:dashed; background:var(--surface-2); }
  .vrow.saved.conflict{ border-style:solid; background:var(--danger-bg); }
  .derived-tag{ font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--accent); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
  .conflict-badge{ font-size:12px; color:var(--danger); font-weight:700; }
  .row-error{ margin:0; font-size:12px; color:var(--danger); font-weight:700; }

  .chore-row{ display:flex; align-items:center; gap:8px; }
  .chore-row input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--success); }
  .chore-row input.cname{ flex:1; min-width:70px; }
  .chore-row.done .cname{ text-decoration:line-through; color:var(--ink-soft); }

  .cat-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .cat-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--accent); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px 8px 3px 10px; }
  .cat-chip-x{ border:0; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:11px; line-height:1; padding:0; }
  .cat-chip-x:hover{ color:var(--danger); }
  .cat-group{ display:flex; flex-direction:column; gap:6px; }
  .cat-group + .cat-group{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .cat-group-label{ font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--ink-soft); text-transform:uppercase; }

  .shop-row{ border:1px solid var(--line); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .shop-row input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--success); }
  .shop-row.urgent{ border-color:var(--danger); background:var(--danger-bg); }
  .shop-row.done .shop-name{ text-decoration:line-through; color:var(--ink-soft); }
  .shop-name{ flex:1; min-width:70px; }
  .urgent-text{ color:var(--danger); font-weight:700; }

  .empty-hint{ font-size:13px; color:var(--ink-soft); }

  /* ---------- template editor ---------- */
  .wd-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .wd-tab{ border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:14px; }
  .wd-tab[data-active="1"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }

  /* ---------- kanban / TV mode ---------- */
  .kanban{ background:#101214; color:#F2EAD8; min-height:100vh; padding:22px; }
  .kanban .k-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .kanban .k-title{ font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:26px; letter-spacing:.03em; }
  .kanban .k-clock{ font-family:"IBM Plex Mono",monospace; font-size:34px; color:#E3A542; font-variant-numeric:tabular-nums; }
  .kanban .k-exit{ border:1px solid #3A3F44; background:#1A1D20; color:#F2EAD8; border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; }
  .kanban .k-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:900px){ .kanban .k-grid{ grid-template-columns:1fr; } }
  .kanban .k-col{ border:1px solid #2C3034; border-radius:12px; background:#17191C; padding:16px; }
  .kanban .k-col h2{ font-family:"Big Shoulders Display",sans-serif; font-size:24px; margin:0 0 10px; border-bottom:2px solid #2C3034; padding-bottom:8px; letter-spacing:.02em; }
  .kanban .k-sec{ margin-bottom:14px; }
  .kanban .k-sec-label{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#8A8F94; margin-bottom:6px; }
  .kanban .k-line{
    display:flex; justify-content:space-between; gap:10px; font-family:"IBM Plex Mono",monospace;
    font-size:18px; padding:6px 0; border-bottom:1px dashed #2A2E32; font-variant-numeric:tabular-nums;
  }
  .kanban .k-line:last-child{ border-bottom:0; }
  .kanban .k-line.conflict{ color:#FF8A73; }
  .kanban .k-line .k-val{ color:#F2EAD8; }
  .kanban .k-line .k-lbl{ color:#9CA3A8; }
  .kanban .k-chip{ font-size:12px; padding:2px 8px; border-radius:999px; background:#242830; color:#C9CFD4; }
  .kanban .k-chip.done{ background:var(--success-bg); color:#7CB56A; }
  .kanban .k-chip.urgent{ background:#4A1F1F; color:#FF8A73; font-weight:700; }
  .kanban .k-shopping{ margin-top:18px; }
  @keyframes kflash{ 0%{ opacity:.4; } 100%{ opacity:1; } }
  .kanban.refresh .k-grid{ animation:kflash .5s ease; }
  @media (prefers-reduced-motion: reduce){ .kanban.refresh .k-grid{ animation:none; } }

  .gate-overlay{
    position:fixed; inset:0; background:rgba(20,18,14,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .gate-card{ background:var(--surface); border-radius:14px; padding:26px; max-width:360px; text-align:center; box-shadow:var(--shadow); }
  .gate-card h2{ font-family:"Big Shoulders Display",sans-serif; margin:0 0 6px; font-size:22px; }
  .gate-card p{ color:var(--ink-soft); font-size:14px; margin:0 0 18px; }
  .gate-btns{ display:flex; gap:10px; justify-content:center; }
  .gate-btns button{ flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); font-weight:700; cursor:pointer; font-size:15px; }
  .gate-btns button:hover{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

  .footnote{ text-align:center; color:var(--ink-soft); font-size:12px; padding:20px 10px 30px; }
  .conn-note{ text-align:center; font-size:12px; padding:6px 10px; }
  .conn-note.offline{ color:var(--danger); background:var(--danger-bg); }
  [hidden]{ display:none!important; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 20px; border-radius:999px;
    font-size:14px; font-weight:600; box-shadow:var(--shadow); z-index:2000;
    opacity:0; transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  .lock-overlay{
    position:fixed; inset:0; z-index:999; background:var(--paper);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .lock-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px; max-width:340px; width:100%; text-align:center; box-shadow:var(--shadow); }
  .lock-card h2{ font-family:"Big Shoulders Display",sans-serif; margin:0 0 6px; font-size:22px; }
  .lock-card p{ color:var(--ink-soft); font-size:14px; margin:0 0 16px; }
  .lock-card input{ width:100%; margin-bottom:10px; padding:10px; font-size:15px; text-align:center; }
  .lock-card button{ width:100%; padding:11px; border-radius:10px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:700; cursor:pointer; font-size:15px; }
  .lock-error{ color:var(--danger)!important; font-size:13px!important; margin-top:8px!important; }
</style>
</head>
<body>

<div class="lock-overlay" id="lockGate">
  <div class="lock-card">
    <h2>🔒 家庭看板</h2>
    <p>這是私人看板，請輸入密碼查看。編輯密碼跟觀看密碼不同，之後這台裝置上的瀏覽器不會再問第二次。</p>
    <input type="password" id="lockInput" placeholder="輸入密碼" autocomplete="off">
    <button id="lockSubmit">進入看板</button>
    <p class="lock-error empty-hint" id="lockError" hidden>密碼不對，再試一次</p>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">家庭派工看板</span>
    <span class="brand-sub">Household Dispatch Board</span>
  </div>
  <div class="clock mono" id="headerClock">--:--:--</div>
  <span class="view-badge" id="viewBadge" hidden>🔍 僅檢視</span>
  <div class="persona-switch" id="personaSwitch">
    <button class="persona-btn" data-persona="husband">Robert</button>
    <button class="persona-btn" data-persona="wife">Claire</button>
  </div>
  <button class="logout-btn" id="kanbanEnterBtn" title="看板模式（給電視/大螢幕看的整頁摘要）">📺 看板模式</button>
  <button class="logout-btn" id="logoutBtn" title="登出，這台裝置下次要重新輸入密碼">🔒 登出</button>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn" data-view="day" data-offset="0">今天</button>
  <button class="tab-btn" data-view="day" data-offset="1">明天</button>
  <button class="tab-btn" data-view="template">預設班表</button>
  <button class="tab-btn" data-view="shopping">🛒 購物清單</button>
  <input type="date" id="datePick" class="mono">
</nav>

<p class="conn-note" id="connNote" hidden></p>

<main id="app">
  <p class="empty-hint" style="padding:20px;">載入中…</p>
</main>

<div class="gate-overlay" id="gate" hidden>
  <div class="gate-card">
    <h2>你是誰？</h2>
    <p>選一下身份，之後在看板上輸入的東西會標記是誰填的，也可以隨時在右上角切換。</p>
    <div class="gate-btns">
      <button data-persona="husband">我是 Robert</button>
      <button data-persona="wife">我是 Claire</button>
    </div>
  </div>
</div>

<p class="footnote" id="footnote">資料即時同步・沒有登入機制，連結請留意保存 · 家庭派工看板</p>

<div class="toast" id="toast" hidden></div>

<script type="module">
  // ---------------- Firebase setup ----------------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getFirestore, doc, onSnapshot, setDoc
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyAlWhwi8ZB9AJJWdEuU4AdL2CrtXbmC7UU",
    authDomain: "familydaily-922c1.firebaseapp.com",
    projectId: "familydaily-922c1",
    storageBucket: "familydaily-922c1.firebasestorage.app",
    messagingSenderId: "130605921918",
    appId: "1:130605921918:web:13883d120221d09b654a2f"
  };

  var fbApp = initializeApp(firebaseConfig);
  var firestore = getFirestore(fbApp);

  // Thin adapter so the rest of the app can talk to Firestore the same
  // way regardless of backend: db.doc(path).onSnapshot(cb, errCb) / .set(data)
  var dbAdapter = {
    doc: function(path){
      var ref = doc(firestore, path);
      return {
        onSnapshot: function(next, err){
          return onSnapshot(ref, function(snap){
            next({ exists: snap.exists(), data: function(){ return snap.data(); } });
          }, err);
        },
        set: function(data){ return setDoc(ref, data); }
      };
    }
  };

  window.__familyBoardDb = dbAdapter;
  window.dispatchEvent(new CustomEvent("familyboard-db-ready"));
</script>

<script>
(function(){
  "use strict";

  // ---------------- simple site lock (two tiers) ----------------
  // NOT real security — both hashes below sit in this page's own source, so
  // anyone who reads the source and is willing to brute-force it can get in.
  // It only keeps out casual link-stumblers/crawlers on a public URL.
  // Two passphrases map to two roles: EDIT_PASSPHRASE_HASH unlocks full
  // editing (Robert & Claire), VIEW_PASSPHRASE_HASH unlocks read-only viewing
  // for everyone else. Regenerate a hash with, e.g. in Node:
  //   require("crypto").createHash("sha256").update("new-passphrase","utf8").digest("hex")
  var EDIT_PASSPHRASE_HASH = "41f62643df42d7c62b337bd0478cde804104189ac099f8621b92a242b57611c5"; // "033609183"
  var VIEW_PASSPHRASE_HASH = "615ed7fb1504b0c724a296d7a69e6c7b2f9ea2c57c1d8206c5afdf392ebdfd25"; // "88888888"
  var ROLE_KEY = "fb_role_v1"; // stored value: "edit" | "view"

  function sha256Hex(str){
    var data = new TextEncoder().encode(str);
    return crypto.subtle.digest("SHA-256", data).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    });
  }

  (function initLock(){
    var overlay = document.getElementById("lockGate");
    if(!overlay) return;
    if(localStorage.getItem(ROLE_KEY)){ overlay.hidden = true; return; }
    var input = document.getElementById("lockInput");
    var err = document.getElementById("lockError");
    function trySubmit(){
      if(!input.value){ return; }
      if(!window.crypto || !window.crypto.subtle){
        // Non-secure context (e.g. plain http, not https/localhost) — Web
        // Crypto isn't available there, so the lock can't be checked at all.
        err.hidden = false;
        err.textContent = "這個瀏覽器環境沒辦法驗證密碼（需要 https），請改用正式網址開啟";
        return;
      }
      sha256Hex(input.value).then(function(hash){
        var role = hash === EDIT_PASSPHRASE_HASH ? "edit" : (hash === VIEW_PASSPHRASE_HASH ? "view" : "");
        if(role){
          localStorage.setItem(ROLE_KEY, role);
          overlay.hidden = true;
          // The app below already finished its initial render by the time this
          // promise resolves (state started out defaulting to "edit" since
          // localStorage had no role yet) — push the real role in now and
          // re-render so the unlocked view immediately reflects it.
          if(typeof state === "object" && state){ state.role = role; }
          if(typeof render === "function"){ render(); }
        } else {
          err.hidden = false;
          err.textContent = "密碼不對，再試一次";
          input.value = "";
          input.focus();
        }
      });
    }

  // A commute set to an actual vehicle (car/moto1/moto2) counts as using that
  // vehicle for that time window — surface it in the booking list below so a
  // clash (someone else booking the same vehicle over that window) actually
  // gets caught, instead of the commute silently not counting as "usage".
  // These are computed fresh from the commute fields on every render rather
  // than stored, so there's exactly one source of truth: edit the commute
  // above and the booking reflects it immediately, with nothing to keep in sync.
  function deriveCommuteVehicles(day){
    var out = [];
    [["husband","Robert"],["wife","Claire"]].forEach(function(pair){
      var person = pair[0], label = pair[1];
      var c = day.commute[person];
      if(c && c.start && c.end && VEHICLE_MODES.indexOf(c.mode) !== -1){
        out.push({
          id: "commute-"+person, resource: c.mode, who: person, customLabel: "",
          start: c.start, end: c.end, note: label+"的通勤", derived: true
        });
      }
    });
    return out;
  }

  function findConflicts(vehicles){
    var conflictIds = {};
    var byResource = {};
    vehicles.forEach(function(v){ (byResource[v.resource] = byResource[v.resource]||[]).push(v); });
    Object.keys(byResource).forEach(function(res){
      var list = byResource[res];
      for(var i=0;i<list.length;i++){
        for(var j=i+1;j<list.length;j++){
          var a=list[i], b=list[j];
          if(!a.start||!a.end||!b.start||!b.end) continue;
          var overlap = a.start < b.end && b.start < a.end;
          if(!overlap) continue;
          var keyA = a.who + (a.who==="other" ? ":"+a.customLabel : "");
          var keyB = b.who + (b.who==="other" ? ":"+b.customLabel : "");
          var samePerson = keyA === keyB;
          // Same person overlapping is only OK when it's their own commute-sync
          // window containing their own manually-added errand with that vehicle.
          // Two independent manual bookings by the same person still conflict.
          var oneIsOwnDerived = samePerson && (a.derived === true || b.derived === true);
          if(samePerson && !oneIsOwnDerived){
            conflictIds[a.id]=true; conflictIds[b.id]=true;
          } else if(!samePerson){
            conflictIds[a.id]=true; conflictIds[b.id]=true;
          }
        }
      }
    });
    return conflictIds;
  }

  function ensureDaySub(dateStr){
    if(state.daySubs[dateStr] || !state.db) return;
    state.daySubs[dateStr] = state.db.doc("days/"+dateStr).onSnapshot(function(snap){
      showConnNote(false);
      var incoming = snap.exists ? snap.data() : null;
      // Guard against an out-of-order confirmation: writes go out to the
      // shared store one at a time, but their server round-trips can finish
      // out of order (e.g. adding a row, then quickly editing + confirming it
      // — the "add" write's slower confirmation can arrive AFTER the newer
      // "confirm" write already landed locally). Without this check, that
      // late, stale snapshot would silently overwrite the newer data and the
      // just-confirmed edit would appear to do nothing. Every write stamps
      // updatedAt, so an incoming snapshot older than what's already showing
      // locally is stale and gets ignored instead of applied.
      var localUpdatedAt = (state.dayCache[dateStr] && state.dayCache[dateStr].updatedAt) || 0;
      var incomingUpdatedAt = (incoming && incoming.updatedAt) || 0;
      if(incoming && localUpdatedAt && incomingUpdatedAt < localUpdatedAt) return;
      var changed = JSON.stringify(normalizeDay(incoming)) !== JSON.stringify(normalizeDay(state.dayCache[dateStr]));
      state.dayCache[dateStr] = incoming;

  // ---------------- shopping list (not date-scoped — one persistent list) ----------------
  function defaultShopping(){

  function normalizeShopping(raw){
    var base = defaultShopping();
    if(!raw) return base;
    var categories = Array.isArray(raw.categories) && raw.categories.length ? raw.categories.slice() : base.categories;
    var items = Array.isArray(raw.items) ? raw.items.map(function(it){
      return {
        id: it.id || genId(),
        name: it.name || "",
        category: it.category || (categories[0]||""),
        assignee: it.assignee || "",

  function getEffectiveShopping(){

  // Red/urgent warning window: due date is today, tomorrow, or already past
  // (overdue keeps warning until bought or deleted; "tomorrow" gives a day's
  // lead time instead of the warning appearing only on the due day itself).
  function isShoppingUrgent(item){
    if(item.done || !item.due) return false;
    var tomorrowStr = toISODate(addDays(new Date(),1));
    return item.due <= tomorrowStr;
  }
  function sortShoppingItems(items){
    return items.slice().sort(function(a,b){
      if(a.done !== b.done) return a.done ? 1 : -1;
      var ad = a.due || "9999-99-99", bd = b.due || "9999-99-99";
      return ad < bd ? -1 : (ad > bd ? 1 : 0);
    });
  }
  // Splits items into one bucket per known category (in category-list order),
  // each internally sorted so the nearest due date comes first; used by both
  // the shopping tab and the kanban-mode summary so they group the same way.
  function groupShoppingByCategory(items, categories){
    var byCat = {};
    categories.forEach(function(c){ byCat[c] = []; });
    var extra = [];
    items.forEach(function(it){
      if(byCat.hasOwnProperty(it.category)) byCat[it.category].push(it);
      else extra.push(it);
    });
    var groups = categories.map(function(c){ return { category: c, items: sortShoppingItems(byCat[c]) }; });
    if(extra.length) groups.push({ category: "其他分類", items: sortShoppingItems(extra) });
    return groups;
  }

  // ---------------- init data backend ----------------
  function startWithDb(db){
    if(state.db) return; // already started
    state.db = db;
    for(var wd=0; wd<7; wd++){
      (function(wd){
        db.doc("template/"+wd).onSnapshot(function(snap){
          showConnNote(false);
          var wasLoaded = state.templatesLoaded[wd];
          var changed = true;
          if(snap.exists){
            var incoming = normalizeTemplate(snap.data());
            changed = JSON.stringify(incoming) !== JSON.stringify(state.templates[wd] || null);
            state.templates[wd] = incoming;
          } else if(!wasLoaded) {
            db.doc("template/"+wd).set(defaultTemplate()).catch(function(){});
          }
          state.templatesLoaded[wd] = true;
          state.ready = Object.keys(state.templatesLoaded).length >= 7;
          if(changed || !wasLoaded) render();
        }, function(err){ console.error("template sub error", err); showConnNote(true); });
      })(wd);
    }
    ensureDaySub(toISODate(new Date()));
    ensureDaySub(toISODate(addDays(new Date(),1)));

    if(el) el.textContent = s;

    // re-renders on a timer, so without this check the screen would just sit

  // Manually-added vehicle rows have two visual states, mirroring the
  // read-only "通勤同步" block above them so a saved entry is unmistakably
  // saved instead of looking identical to one still being typed into:
  //  - "editing": the form (dropdowns/time/note + ✓確認) — shown for a row
  //    that was just added, or that "✏️ 修改" was tapped on.
  //  - "saved": a compact read-only summary + 修改/刪除 buttons — shown for
  //    every row by default once it's been confirmed.
  // Which state a row is in is tracked in state.vehicleEditing (a set of
  // ids), which is purely local UI state — it's not written to the shared
  // day doc, so it resets to "saved" for everyone on a fresh page load.
  //
  // While in the editing form, nothing is written or re-rendered on every
  // keystroke/scroll (see the old debounce-vs-native-time-picker problem);
  // fields just sit in the DOM until "✓ 確認" reads their current values and

    var ro = isViewOnly();
    var editing = !ro && state.vehicleEditing[v.id] === true;
    return editing ? vehicleEditRowHtml(dateStr, v, isConflict) : vehicleSavedRowHtml(dateStr, v, isConflict, ro);
  }

  function vehicleSavedRowHtml(dateStr, v, isConflict, ro){
    var resLabel = labelOf(RESOURCES, v.resource);
    var personLabelText = personLabel(v.who, v.customLabel);
    var timeText = (v.start && v.end) ? (v.start+'–'+v.end) : '尚未設定時間';
    return '<div class="vrow saved'+(isConflict?' conflict':'')+'">'
      + '<div class="row">'
        + '<span class="derived-tag">📌 已登記</span>'
        + '<strong>'+resLabel+'</strong>'
        + '<span class="sep">·</span>'
        + '<span>'+personLabelText+'</span>'
        + '<span class="mono">'+timeText+'</span>'
      + '</div>'
      + (v.note ? '<p class="empty-hint" style="margin:0;">'+escapeAttr(v.note)+'</p>' : '')
      + (ro ? '' : (
          '<div class="row">'
          + '<button class="iconbtn" title="修改" data-action="vehicle-edit" data-date="'+dateStr+'" data-id="'+v.id+'">✏️</button>'
          + '<button class="iconbtn" title="刪除" data-action="vehicle-remove" data-date="'+dateStr+'" data-id="'+v.id+'">✕</button>'
          + '</div>'
        ))
      + (isConflict ? '<span class="conflict-badge">⚠ 這台車此時段被重複登記</span>' : '')
      + '</div>';
  }

  function vehicleEditRowHtml(dateStr, v, isConflict){
    var opts = PEOPLE_VEHICLE.map(function(p){ return '<option value="'+p.id+'"'+(p.id===v.who?' selected':'')+'>'+p.label+'</option>'; }).join("");
    var resOpts = RESOURCES.map(function(r){ return '<option value="'+r.id+'"'+(r.id===v.resource?' selected':'')+'>'+r.label+'</option>'; }).join("");
    return '<div class="vrow'+(isConflict?' conflict':'')+'" data-date="'+dateStr+'" data-id="'+v.id+'">'
      + '<div class="row">'
        + '<select data-action="vehicle-field" data-field="resource">'+resOpts+'</select>'
        + '<select data-action="vehicle-field" data-field="who">'+opts+'</select>'
        + (v.who==="other" ? '<input type="text" placeholder="是誰" class="note" style="max-width:90px" value="'+escapeAttr(v.customLabel)+'" data-action="vehicle-field" data-field="customLabel">' : '')
        + '<input type="time" class="mono" value="'+v.start+'" data-action="vehicle-field" data-field="start">'
        + '<span class="sep">–</span>'
        + '<input type="time" class="mono" value="'+v.end+'" data-action="vehicle-field" data-field="end">'
        + '<button class="iconbtn" title="刪除" data-action="vehicle-remove" data-date="'+dateStr+'" data-id="'+v.id+'">✕</button>'
      + '</div>'
      + '<input type="text" class="note" placeholder="備註（例如：去哪裡）" value="'+escapeAttr(v.note)+'" data-action="vehicle-field" data-field="note">'
      + '<p class="row-error" hidden></p>'
      + '<button class="confirmbtn" data-action="vehicle-confirm" data-date="'+dateStr+'" data-id="'+v.id+'">✓ 確認</button>'

      + '</div>';
  }

  // A brand-new registration lives only here (never written to the shared
  // day doc) until it passes validation and the person taps "確認新增" —
  // so an unconfigured/blank row can never be saved, and cancelling just
  // discards it with nothing left behind.
  function vehicleDraftRowHtml(dateStr, draft){
    var opts = PEOPLE_VEHICLE.map(function(p){ return '<option value="'+p.id+'"'+(p.id===draft.who?' selected':'')+'>'+p.label+'</option>'; }).join("");
    var resOpts = RESOURCES.map(function(r){ return '<option value="'+r.id+'"'+(r.id===draft.resource?' selected':'')+'>'+r.label+'</option>'; }).join("");
    return '<div class="vrow" data-date="'+dateStr+'" data-id="__draft__">'
      + '<div class="row">'
        + '<select data-action="vehicle-field" data-field="resource">'+resOpts+'</select>'
        + '<select data-action="vehicle-field" data-field="who">'+opts+'</select>'
        + (draft.who==="other" ? '<input type="text" placeholder="是誰" class="note" style="max-width:90px" value="'+escapeAttr(draft.customLabel)+'" data-action="vehicle-field" data-field="customLabel">' : '')
        + '<input type="time" class="mono" value="'+draft.start+'" data-action="vehicle-field" data-field="start">'
        + '<span class="sep">–</span>'
        + '<input type="time" class="mono" value="'+draft.end+'" data-action="vehicle-field" data-field="end">'
        + '<button class="iconbtn" title="取消" data-action="vehicle-draft-cancel" data-date="'+dateStr+'">✕</button>'
      + '</div>'
      + '<input type="text" class="note" placeholder="備註（例如：去哪裡）" value="'+escapeAttr(draft.note)+'" data-action="vehicle-field" data-field="note">'
      + '<p class="row-error" hidden></p>'
      + '<button class="confirmbtn" data-action="vehicle-draft-confirm" data-date="'+dateStr+'">✓ 確認新增</button>'
      + '</div>';
  }

  function readVehicleFieldsFromRow(row){
    var resourceEl = row.querySelector('[data-field="resource"]');
    var whoEl = row.querySelector('[data-field="who"]');
    var customLabelEl = row.querySelector('[data-field="customLabel"]');
    var startEl = row.querySelector('[data-field="start"]');
    var endEl = row.querySelector('[data-field="end"]');
    var noteEl = row.querySelector('[data-field="note"]');
    return {
      resource: resourceEl ? resourceEl.value : "",
      who: whoEl ? whoEl.value : "",
      customLabel: customLabelEl ? customLabelEl.value : "",
      start: startEl ? startEl.value : "",
      end: endEl ? endEl.value : "",
      note: noteEl ? noteEl.value : ""
    };
  }

  function validateVehicleFields(fields){
    if(!fields.resource) return "請選擇車輛";
    if(!fields.who) return "請選擇是誰使用";
    if(fields.who==="other" && !fields.customLabel.trim()) return "請填寫「其他」是誰使用";
    if(!fields.start || !fields.end) return "請設定開始與結束時間";
    if(fields.start >= fields.end) return "結束時間必須晚於開始時間";
    return null;
  }

  function showRowError(row, message){
    var el = row.querySelector(".row-error");
    if(!el) return;
    if(!message){ el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = "⚠ " + message;
  }

  function toggleVehicleCustomLabel(selectEl){
    var row = selectEl.closest(".vrow");
    if(!row) return;
    var existing = row.querySelector('[data-field="customLabel"]');
    if(selectEl.value==="other"){
      if(existing) return;
      var input = document.createElement("input");
      input.type = "text";
      input.placeholder = "是誰";
      input.className = "note";
      input.style.maxWidth = "90px";
      input.setAttribute("data-action","vehicle-field");
      input.setAttribute("data-field","customLabel");
      selectEl.insertAdjacentElement("afterend", input);
    } else if(existing){
      existing.remove();
    }
  }

  function choreRowHtml(dateStr, c){
    var ro = isViewOnly();
    var roAttr = ro ? ' disabled' : '';
    var opts = '<option value="">未指定</option>' + PEOPLE_BASIC.map(function(p){ return '<option value="'+p.id+'"'+(p.id===c.assignee?' selected':'')+'>'+p.label+'</option>'; }).join("");
    return '<div class="chore-row'+(c.done?' done':'')+'">'
      + '<input type="checkbox" '+(c.done?'checked':'')+roAttr+' data-action="chore-toggle" data-date="'+dateStr+'" data-id="'+c.id+'">'
      + '<input type="text" class="cname" value="'+escapeAttr(c.name)+'"'+roAttr+' data-action="chore-field" data-date="'+dateStr+'" data-id="'+c.id+'" data-field="name">'
      + '<select'+roAttr+' data-action="chore-field" data-date="'+dateStr+'" data-id="'+c.id+'" data-field="assignee">'+opts+'</select>'
      + (ro ? '' : '<button class="iconbtn" title="刪除" data-action="chore-remove" data-date="'+dateStr+'" data-id="'+c.id+'">✕</button>')
      + '</div>';
  }

  // ---------------- shopping list rows ----------------
  // Same three-state pattern as the vehicle rows above (saved / edit / draft),
  // for the same reason: a native date picker on mobile gets interrupted by
  // a mid-tap re-render, so nothing writes until an explicit confirm.
  function shoppingRowHtml(item, ro, categories){
    var editing = !ro && state.shoppingEditing[item.id] === true;
    return editing ? shoppingEditRowHtml(item, categories) : shoppingSavedRowHtml(item, ro);
  }

  function shoppingSavedRowHtml(item, ro){
    var roAttr = ro ? ' disabled' : '';
    var assigneeLabel = item.assignee ? labelOf(PEOPLE_BASIC, item.assignee) : "未指定";
    var urgent = isShoppingUrgent(item);
    var dueText = item.due ? item.due : "沒有期限";
    return '<div class="shop-row'+(item.done?' done':'')+(urgent?' urgent':'')+'">'
      + '<div class="row">'
        + '<input type="checkbox" '+(item.done?'checked':'')+roAttr+' data-action="shopping-toggle" data-id="'+item.id+'">'
        + '<strong class="shop-name">'+escapeAttr(item.name)+'</strong>'
        + '<span class="cat-chip">'+escapeAttr(item.category)+'</span>'
        + '<span class="sep">·</span>'
        + '<span>'+assigneeLabel+'</span>'
        + '<span class="mono'+(urgent?' urgent-text':'')+'">'+dueText+(urgent?' ⚠':'')+'</span>'
      + '</div>'
      + (item.note ? '<p class="empty-hint" style="margin:0;">'+escapeAttr(item.note)+'</p>' : '')
      + (ro ? '' : (
          '<div class="row">'
          + '<button class="iconbtn" title="修改" data-action="shopping-edit" data-id="'+item.id+'">✏️</button>'
          + '<button class="iconbtn" title="刪除" data-action="shopping-remove" data-id="'+item.id+'">✕</button>'
          + '</div>'
        ))
      + '</div>';
  }

  function shoppingEditRowHtml(item, categories){
    // If this item's category was since deleted, keep showing it (marked as
    // deleted) instead of silently snapping the select to whatever category
    // happens to be first — otherwise just opening "修改" and tapping 確認
    // without touching anything would quietly move the item to a different
    // category.
    var catList = categories.slice();
    if(item.category && catList.indexOf(item.category)===-1) catList = [item.category].concat(catList);
    var catOpts = catList.map(function(c){
      var isOrphan = categories.indexOf(c)===-1;
      return '<option value="'+escapeAttr(c)+'"'+(c===item.category?' selected':'')+'>'+escapeAttr(c)+(isOrphan?'（已刪除）':'')+'</option>';
    }).join("");
    var whoOpts = PEOPLE_BASIC.map(function(p){ return '<option value="'+p.id+'"'+(p.id===item.assignee?' selected':'')+'>'+p.label+'</option>'; }).join("");
    return '<div class="shop-row" data-id="'+item.id+'">'
      + '<div class="row">'
        + '<input type="text" class="note" placeholder="要買的東西" value="'+escapeAttr(item.name)+'" data-action="shopping-field" data-field="name">'
        + '<select data-action="shopping-field" data-field="category">'+catOpts+'</select>'
      + '</div>'
      + '<div class="row">'
        + '<select data-action="shopping-field" data-field="assignee"><option value="">未指定</option>'+whoOpts+'</select>'
        + '<input type="date" class="mono" value="'+item.due+'" data-action="shopping-field" data-field="due">'
        + '<button class="iconbtn" title="刪除" data-action="shopping-remove" data-id="'+item.id+'">✕</button>'
      + '</div>'
      + '<input type="text" class="note" placeholder="備註" value="'+escapeAttr(item.note)+'" data-action="shopping-field" data-field="note">'
      + '<p class="row-error" hidden></p>'
      + '<button class="confirmbtn" data-action="shopping-confirm" data-id="'+item.id+'">✓ 確認</button>'
      + '</div>';
  }

  // A brand-new item lives only here (never written to the shared shopping
  // doc) until it passes validation and the person taps "確認新增".
  function shoppingDraftRowHtml(draft, categories){
    var catOpts = categories.map(function(c){ return '<option value="'+escapeAttr(c)+'"'+(c===draft.category?' selected':'')+'>'+escapeAttr(c)+'</option>'; }).join("");
    var whoOpts = PEOPLE_BASIC.map(function(p){ return '<option value="'+p.id+'"'+(p.id===draft.assignee?' selected':'')+'>'+p.label+'</option>'; }).join("");

      + '<div class="row">'

        + '<select data-action="shopping-field" data-field="category">'+catOpts+'</select>'
      + '</div>'
      + '<div class="row">'
        + '<select data-action="shopping-field" data-field="assignee"><option value="">未指定</option>'+whoOpts+'</select>'

  function readShoppingFieldsFromRow(row){
    var nameEl = row.querySelector('[data-field="name"]');
    var catEl = row.querySelector('[data-field="category"]');
    var assigneeEl = row.querySelector('[data-field="assignee"]');
    var dueEl = row.querySelector('[data-field="due"]');
    var noteEl = row.querySelector('[data-field="note"]');
    return {
      name: nameEl ? nameEl.value.trim() : "",
      category: catEl ? catEl.value : "",
      assignee: assigneeEl ? assigneeEl.value : "",
      due: dueEl ? dueEl.value : "",
      note: noteEl ? noteEl.value : ""
    };
  }

  function validateShoppingFields(fields){
    if(!fields.name) return "請填寫要買的東西";
    if(!fields.category) return "請選擇類別";
    return null;
  }

  function categoryChipsHtml(categories, ro){
    var chips = categories.map(function(c){
      var del = ro ? '' : '<button class="cat-chip-x" data-action="category-remove" data-category="'+escapeAttr(c)+'" title="刪除類別">✕</button>';
      return '<span class="cat-chip">'+escapeAttr(c)+del+'</span>';
    }).join("");
    if(ro) return '<div class="cat-row">'+chips+'</div>';
    var addUi = state.categoryDraftOpen
      ? ('<input type="text" id="newCatInput" class="note" placeholder="新類別名稱" style="max-width:140px">'
          + '<button class="iconbtn" title="確認新增類別" data-action="category-add-confirm">✓</button>'
          + '<button class="iconbtn" title="取消" data-action="category-add-cancel">✕</button>')
      : '<button class="addbtn" data-action="category-add-open">+ 新增類別</button>';
    return '<div class="cat-row">'+chips+addUi+'</div>';
  }

  function renderShoppingView(){
    ensureShoppingSub();
    var shopping = getEffectiveShopping();
    var ro = isViewOnly();

    var heading = '<div class="day-heading"><h1>🛒 購物清單</h1></div>';

    var catBody = categoryChipsHtml(shopping.categories, ro);

    var groups = groupShoppingByCategory(shopping.items, shopping.categories);
    var nonEmptyGroups = groups.filter(function(g){ return g.items.length; });
    var listBody = nonEmptyGroups.length
      ? nonEmptyGroups.map(function(g){
          return '<div class="cat-group"><div class="cat-group-label">'+escapeAttr(g.category)+'</div>'
            + g.items.map(function(it){ return shoppingRowHtml(it, ro, shopping.categories); }).join("")
            + '</div>';
        }).join("")
      : '<p class="empty-hint">目前沒有要買的東西，點下面新增。</p>';
    var draftOpen = !ro && !!state.shoppingDraft;
    if(draftOpen) listBody += shoppingDraftRowHtml(state.shoppingDraft, shopping.categories);
    if(!ro && !draftOpen) listBody += '<button class="addbtn" data-action="shopping-add">＋ 新增項目</button>';

    return heading
      + sectionCard("類別", catBody)
      + sectionCard("清單", listBody);
  }

  function dayLabelParts(dateStr){
    var d = parseISODate(dateStr);
    var todayStr = toISODate(new Date());
    var tomorrowStr = toISODate(addDays(new Date(),1));
    var tag = dateStr===todayStr ? "今天" : (dateStr===tomorrowStr ? "明天" : "");
    return { tag: tag, dateFmt: (d.getMonth()+1)+"/"+d.getDate(), wk: WEEKDAY_LABELS[d.getDay()], isToday: dateStr===todayStr };
  }

  function renderDayView(){
    var dateStr = currentDateStr();
    ensureDaySub(dateStr);
    var day = getEffectiveDay(dateStr);
    var derivedVehicles = deriveCommuteVehicles(day);
    var conflicts = findConflicts(derivedVehicles.concat(day.vehicles));
    var parts = dayLabelParts(dateStr);
    var ro = isViewOnly();
    var roAttr = ro ? ' disabled' : '';

    var heading = '<div class="day-heading'+(parts.isToday?'':' not-today')+'"><h1>'+(parts.tag?parts.tag+" ":"")+parts.dateFmt+'</h1><span class="wk">星期'+parts.wk+'</span>'
      + (parts.isToday ? '' : '<span class="not-today-badge">⚠ 不是今天，正在編輯這一天的內容</span>')
      + '</div>';

    var commuteBody = commuteRowHtml(dateStr,"husband","Robert",day.commute.husband) + commuteRowHtml(dateStr,"wife","Claire",day.commute.wife);

    var vehicleBody = derivedVehicles.map(function(v){ return derivedVehicleRowHtml(v, !!conflicts[v.id]); }).join("");
    vehicleBody += day.vehicles.length
      ? day.vehicles.map(function(v){ return vehicleRowHtml(dateStr, v, !!conflicts[v.id]); }).join("")
      : (derivedVehicles.length ? '' : '<p class="empty-hint">今天還沒有登記用車，點下面新增。</p>');
    var draftOpen = !ro && !!(state.vehicleDraft && state.vehicleDraft.dateStr === dateStr);
    if(draftOpen) vehicleBody += vehicleDraftRowHtml(dateStr, state.vehicleDraft);
    if(!ro && !draftOpen) vehicleBody += '<button class="addbtn" data-action="vehicle-add" data-date="'+dateStr+'">＋ 新增用車登記</button>';

    var babyBody = ''
      + '<div class="row"><span class="who">送</span>'
        + '<input type="time" class="mono" value="'+day.baby.dropoff.time+'"'+roAttr+' data-action="baby-field" data-date="'+dateStr+'" data-event="dropoff" data-field="time">'
        + '<select'+roAttr+' data-action="baby-field" data-date="'+dateStr+'" data-event="dropoff" data-field="who">'
          + '<option value="">未指定</option>' + PEOPLE_BABY.map(function(p){ return '<option value="'+p.id+'"'+(p.id===day.baby.dropoff.who?' selected':'')+'>'+p.label+'</option>'; }).join("")
        + '</select></div>'
      + '<div class="row"><span class="who">接</span>'
        + '<input type="time" class="mono" value="'+day.baby.pickup.time+'"'+roAttr+' data-action="baby-field" data-date="'+dateStr+'" data-event="pickup" data-field="time">'
        + '<select'+roAttr+' data-action="baby-field" data-date="'+dateStr+'" data-event="pickup" data-field="who">'
          + '<option value="">未指定</option>' + PEOPLE_BABY.map(function(p){ return '<option value="'+p.id+'"'+(p.id===day.baby.pickup.who?' selected':'')+'>'+p.label+'</option>'; }).join("")
        + '</select></div>';

    var choreBody = (day.chores.length ? day.chores.map(function(c){ return choreRowHtml(dateStr, c); }).join("") : '<p class="empty-hint">目前沒有家務項目。</p>')
      + (ro ? '' : '<button class="addbtn" data-action="chore-add" data-date="'+dateStr+'">＋ 新增家務</button>');

    return heading
      + '<div class="grid">'
      + sectionCard("通勤", commuteBody)
      + sectionCard("車輛使用登記", vehicleBody)
      + sectionCard("寶寶接送", babyBody)
      + sectionCard("家務", choreBody)
      + '</div>';
  }

  // ---------------- render: template editor ----------------

  function tplCommuteRow(wd, person, label, data){
    var roAttr = isViewOnly() ? ' disabled' : '';
    return '<div class="row">'
      + '<span class="who">'+label+'</span>'
      + '<input type="time" class="mono" value="'+data.start+'"'+roAttr+' data-action="tpl-commute-field" data-weekday="'+wd+'" data-person="'+person+'" data-field="start">'
      + '<span class="sep">–</span>'
      + '<input type="time" class="mono" value="'+data.end+'"'+roAttr+' data-action="tpl-commute-field" data-weekday="'+wd+'" data-person="'+person+'" data-field="end">'
      + '<select'+roAttr+' data-action="tpl-commute-field" data-weekday="'+wd+'" data-person="'+person+'" data-field="mode">'
        + MODES.map(function(m){ return '<option value="'+m.id+'"'+(m.id===data.mode?' selected':'')+'>'+m.label+'</option>'; }).join("")
      + '</select>'
      + '<input type="text" class="note" placeholder="備註" value="'+escapeAttr(data.note||"")+'"'+roAttr+' data-action="tpl-commute-field" data-weekday="'+wd+'" data-person="'+person+'" data-field="note">'
      + '</div>';
  }
  function tplChoreRow(wd, c){
    var ro = isViewOnly();
    var roAttr = ro ? ' disabled' : '';
    var opts = '<option value="">未指定</option>' + PEOPLE_BASIC.map(function(p){ return '<option value="'+p.id+'"'+(p.id===c.assignee?' selected':'')+'>'+p.label+'</option>'; }).join("");
    return '<div class="chore-row">'
      + '<input type="text" class="cname" value="'+escapeAttr(c.name)+'"'+roAttr+' data-action="tpl-chore-field" data-weekday="'+wd+'" data-id="'+c.id+'" data-field="name">'
      + '<select'+roAttr+' data-action="tpl-chore-field" data-weekday="'+wd+'" data-id="'+c.id+'" data-field="assignee">'+opts+'</select>'
      + (ro ? '' : '<button class="iconbtn" title="刪除" data-action="tpl-chore-remove" data-weekday="'+wd+'" data-id="'+c.id+'">✕</button>')
      + '</div>';
  }

  // ---------------- render: kanban ----------------
  function kanbanColumn(dateStr, title){
    var day = getEffectiveDay(dateStr);
    var derivedVehicles = deriveCommuteVehicles(day);
    var allVehicles = derivedVehicles.concat(day.vehicles);
    var conflicts = findConflicts(allVehicles);
    var commuteLines = [
      kLine("Robert", day.commute.husband.start && day.commute.husband.end ? (day.commute.husband.start+"–"+day.commute.husband.end+" "+labelOf(MODES,day.commute.husband.mode)) : "尚未設定"),
      kLine("Claire", day.commute.wife.start && day.commute.wife.end ? (day.commute.wife.start+"–"+day.commute.wife.end+" "+labelOf(MODES,day.commute.wife.mode)) : "尚未設定")
    ].join("");

    var vehicleLines = RESOURCES.map(function(r){
      var uses = allVehicles.filter(function(v){ return v.resource===r.id; });
      if(!uses.length) return kLine(r.label, "未使用");
      return uses.map(function(v){
        var isC = conflicts[v.id];
        return kLine(r.label, v.start+"–"+v.end+" "+personLabel(v.who,v.customLabel), isC);
      }).join("");
    }).join("");

    var babyLines = kLine("送", day.baby.dropoff.time ? (day.baby.dropoff.time+" "+(personLabel(day.baby.dropoff.who)||"未指定")) : "尚未設定")
      + kLine("接", day.baby.pickup.time ? (day.baby.pickup.time+" "+(personLabel(day.baby.pickup.who)||"未指定")) : "尚未設定");

    var choreLines = day.chores.length ? day.chores.map(function(c){
      return '<span class="k-chip'+(c.done?' done':'')+'">'+(c.done?"☑":"☐")+" "+escapeAttr(c.name)+(c.assignee?"・"+labelOf(PEOPLE_BASIC,c.assignee):"")+'</span>';
    }).join(" ") : '<span class="k-chip">無項目</span>';

    return '<div class="k-col"><h2>'+title+'</h2>'
      + '<div class="k-sec"><div class="k-sec-label">通勤</div>'+commuteLines+'</div>'
      + '<div class="k-sec"><div class="k-sec-label">車輛</div>'+vehicleLines+'</div>'
      + '<div class="k-sec"><div class="k-sec-label">寶寶接送</div>'+babyLines+'</div>'
      + '<div class="k-sec"><div class="k-sec-label">家務</div><div style="display:flex;gap:8px;flex-wrap:wrap;">'+choreLines+'</div></div>'
      + '</div>';
  }
  function kLine(label, val, conflict){
    return '<div class="k-line'+(conflict?' conflict':'')+'"><span class="k-lbl">'+label+'</span><span class="k-val">'+val+(conflict?' ⚠':'')+'</span></div>';
  }
  function kanbanShoppingSection(){
    var shopping = getEffectiveShopping();
    var pending = shopping.items.filter(function(it){ return !it.done; });
    var groups = groupShoppingByCategory(pending, shopping.categories).filter(function(g){ return g.items.length; });
    var body = groups.length ? groups.map(function(g){
      var chips = g.items.map(function(it){
        var urgent = isShoppingUrgent(it);
        return '<span class="k-chip'+(urgent?' urgent':'')+'">'+(urgent?'⚠ ':'')+escapeAttr(it.name)
          + (it.assignee?'・'+labelOf(PEOPLE_BASIC,it.assignee):'')
          + (it.due?'・'+it.due:'')
          + '</span>';
      }).join(" ");
      return '<div class="k-sec"><div class="k-sec-label">'+escapeAttr(g.category)+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;">'+chips+'</div></div>';
    }).join("") : '<div class="k-sec"><span class="k-chip">沒有要買的東西</span></div>';
    return '<div class="k-col k-shopping"><h2>🛒 待買清單</h2>'+body+'</div>';
  }
  function renderKanbanShell(){
    var todayStr = toISODate(new Date());
    var tomorrowStr = toISODate(addDays(new Date(),1));
    ensureDaySub(todayStr); ensureDaySub(tomorrowStr);
    ensureShoppingSub();
    var d = new Date();
    var dateFmt = (d.getMonth()+1)+"/"+d.getDate()+"（星期"+WEEKDAY_LABELS[d.getDay()]+"）";
    return '<div class="kanban" id="kanbanRoot">'
      + '<div class="k-top"><div><div class="k-title">家庭派工看板</div><div style="color:#8A8F94;font-size:13px;margin-top:2px;">'+dateFmt+'</div></div>'
      + '<div class="k-clock mono" id="kanbanClock">--:--:--</div>'
      + '<button class="k-exit" data-action="exit-kanban">離開看板模式</button></div>'
      + '<div class="k-grid">' + kanbanColumn(todayStr,"今天") + kanbanColumn(tomorrowStr,"明天") + '</div>'
      + kanbanShoppingSection()
      + '</div>';
  }

  // ---------------- event handling ----------------
  document.getElementById("personaSwitch").addEventListener("click", function(e){
    var btn = e.target.closest("[data-persona]");
    if(!btn) return;
    setPersona(btn.dataset.persona);
  });
  document.getElementById("gate").addEventListener("click", function(e){
    var btn = e.target.closest("[data-persona]");
    if(!btn) return;
    setPersona(btn.dataset.persona);
  });
  function setPersona(p){
    state.persona = p;
    localStorage.setItem("fb_persona", p);
    updatePersonaUI();
  }

  document.getElementById("tabs").addEventListener("click", function(e){
    var btn = e.target.closest(".tab-btn");
    if(!btn) return;
    state.view = btn.dataset.view;
    if(btn.dataset.view==="day"){
      state.dayOffset = Number(btn.dataset.offset);
      state.customDate = null;
      // Keep the picker showing whichever date "今天"/"明天" actually points
      // to, instead of blanking it — otherwise it looks like the date was
      // wiped every time you tap back to today/tomorrow.
      document.getElementById("datePick").value = toISODate(addDays(new Date(), state.dayOffset));
    }
    render();
  });
  document.getElementById("datePick").addEventListener("change", function(e){
    if(!e.target.value) return;
    state.view = "day"; state.customDate = e.target.value;
    render();
  });
  // Default the date picker to today's date so it doesn't look empty/unclickable
  // on first load; this only sets what's displayed, it does not touch
  // state.customDate, so "今天"/"明天" tab behaviour is unaffected.
  document.getElementById("datePick").value = toISODate(new Date());

  // These actions change data; a viewer-role session ignores them even if
  // something slipped through without a disabled attribute (belt-and-braces —
  // the visual disabling above is the main defense, this just backstops it).
  var MUTATING_ACTIONS = ["vehicle-add","vehicle-remove","vehicle-confirm","vehicle-edit","vehicle-draft-confirm","vehicle-draft-cancel","chore-add","chore-remove","chore-toggle","tpl-chore-add","tpl-chore-remove","shopping-add","shopping-remove","shopping-confirm","shopping-edit","shopping-draft-confirm","shopping-draft-cancel","shopping-toggle","category-add-open","category-add-cancel","category-add-confirm","category-remove"];

  document.getElementById("app").addEventListener("click", function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.dataset.action;
    if(isViewOnly() && MUTATING_ACTIONS.indexOf(action)!==-1) return;

    if(action==="vehicle-add"){
      // Nothing is written yet — this just opens a local draft form. It only
      // becomes a real registration (and gets written) once it passes
      // validation and the person taps "確認新增"; see vehicle-draft-confirm.
      var dateStr = t.dataset.date;
      state.vehicleDraft = {dateStr: dateStr, resource:"car", who: state.persona || "husband", customLabel:"", start:"", end:"", note:""};
      render();
    } else if(action==="vehicle-draft-cancel"){
      state.vehicleDraft = null;
      render();
    } else if(action==="vehicle-draft-confirm"){
      var dateStr = t.dataset.date;
      var row = t.closest(".vrow");
      if(!row) return;
      var fields = readVehicleFieldsFromRow(row);
      var err = validateVehicleFields(fields);
      if(err){ showRowError(row, err); return; }
      var day = getEffectiveDay(dateStr);
      day.vehicles.push(Object.assign({id: genId()}, fields));
      state.vehicleDraft = null;
      writeDay(dateStr, day);
      showToast("✓ 已新增用車登記");
    } else if(action==="vehicle-edit"){
      var id = t.dataset.id;
      state.vehicleEditing[id] = true;
      render();
    } else if(action==="vehicle-remove"){
      var dateStr = t.dataset.date, id = t.dataset.id;
      var day = getEffectiveDay(dateStr);
      day.vehicles = day.vehicles.filter(function(v){ return v.id!==id; });
      delete state.vehicleEditing[id];
      writeDay(dateStr, day);
    } else if(action==="chore-add"){
      var dateStr = t.dataset.date;
      var day = getEffectiveDay(dateStr);
      day.chores.push({id:genId(), name:"新家務", assignee:"", done:false});
      writeDay(dateStr, day);
    } else if(action==="chore-remove"){
      var dateStr = t.dataset.date, id = t.dataset.id;
      var day = getEffectiveDay(dateStr);
      day.chores = day.chores.filter(function(c){ return c.id!==id; });
      writeDay(dateStr, day);
    } else if(action==="chore-toggle"){
      var dateStr = t.dataset.date, id = t.dataset.id;
      var day = getEffectiveDay(dateStr);
      day.chores = day.chores.map(function(c){ return c.id===id ? Object.assign({}, c, {done:!c.done}) : c; });
      writeDay(dateStr, day);
    } else if(action==="vehicle-confirm"){
      var dateStr = t.dataset.date, id = t.dataset.id;
      var row = t.closest(".vrow");
      if(!row) return;
      var fields = readVehicleFieldsFromRow(row);
      var err = validateVehicleFields(fields);
      if(err){ showRowError(row, err); return; }
      var day = getEffectiveDay(dateStr);
      day.vehicles = day.vehicles.map(function(v){
        if(v.id!==id) return v;
        return Object.assign({}, v, fields);
      });
      delete state.vehicleEditing[id]; // flip this row from the edit form to the saved summary
      writeDay(dateStr, day);
      showToast("✓ 已儲存");
    } else if(action==="tpl-wd-select"){
      state.tplWdView = Number(t.dataset.weekday);
      render();
    } else if(action==="tpl-chore-add"){
      var wd = Number(t.dataset.weekday);
      var tpl = normalizeTemplate(state.templates[wd]);
      tpl.chores.push({id:genId(), name:"新家務", assignee:""});
      writeTemplate(wd, tpl);
    } else if(action==="tpl-chore-remove"){
      var wd = Number(t.dataset.weekday), id = t.dataset.id;
      var tpl = normalizeTemplate(state.templates[wd]);
      tpl.chores = tpl.chores.filter(function(c){ return c.id!==id; });
      writeTemplate(wd, tpl);
    } else if(action==="exit-kanban"){
      state.view = "day"; render();
    } else if(action==="shopping-add"){
      // Just like vehicle-add: open a local draft, write nothing yet.
      var shopping = getEffectiveShopping();
      state.shoppingDraft = { name:"", category: shopping.categories[0] || "", assignee:"", due:"", note:"" };
      render();
    } else if(action==="shopping-draft-cancel"){
      state.shoppingDraft = null;
      render();
    } else if(action==="shopping-draft-confirm"){
      var row = t.closest(".shop-row");
      if(!row) return;
      var fields = readShoppingFieldsFromRow(row);
      var err = validateShoppingFields(fields);
      if(err){ showRowError(row, err); return; }
      var shopping = getEffectiveShopping();
      shopping.items.push(Object.assign({id: genId(), done:false}, fields));
      state.shoppingDraft = null;
      writeShopping(shopping);
      showToast("✓ 已新增購物項目");
    } else if(action==="shopping-edit"){
      state.shoppingEditing[t.dataset.id] = true;
      render();
    } else if(action==="shopping-remove"){
      var id = t.dataset.id;
      var shopping = getEffectiveShopping();
      shopping.items = shopping.items.filter(function(it){ return it.id!==id; });
      delete state.shoppingEditing[id];
      writeShopping(shopping);
    } else if(action==="shopping-confirm"){
      var id = t.dataset.id;
      var row = t.closest(".shop-row");
      if(!row) return;
      var fields = readShoppingFieldsFromRow(row);
      var err = validateShoppingFields(fields);
      if(err){ showRowError(row, err); return; }
      var shopping = getEffectiveShopping();
      shopping.items = shopping.items.map(function(it){ return it.id===id ? Object.assign({}, it, fields) : it; });
      delete state.shoppingEditing[id];
      writeShopping(shopping);
      showToast("✓ 已儲存");
    } else if(action==="shopping-toggle"){
      var id = t.dataset.id;
      var shopping = getEffectiveShopping();
      shopping.items = shopping.items.map(function(it){ return it.id===id ? Object.assign({}, it, {done: !it.done}) : it; });
      writeShopping(shopping);
    } else if(action==="category-add-open"){
      state.categoryDraftOpen = true;
      render();
    } else if(action==="category-add-cancel"){
      state.categoryDraftOpen = false;
      render();
    } else if(action==="category-add-confirm"){
      var input = document.getElementById("newCatInput");
      var name = input ? input.value.trim() : "";
      if(!name){ showToast("請輸入類別名稱"); return; }
      var shopping = getEffectiveShopping();
      if(shopping.categories.indexOf(name) !== -1){ showToast("這個類別已經存在"); return; }
      shopping.categories.push(name);
      state.categoryDraftOpen = false;
      writeShopping(shopping);
      showToast("✓ 已新增類別："+name);
    } else if(action==="category-remove"){
      var cat = t.dataset.category;
      var shopping = getEffectiveShopping();
      if(shopping.categories.length <= 1){ showToast("至少要保留一個類別"); return; }
      // Items keep whatever category string they already had — nothing is
      // deleted or reassigned. groupShoppingByCategory() already buckets any
      // item whose category isn't in the known list under "其他分類", so a
      // deleted category's old items just surface there instead of vanishing.
      var affected = shopping.items.filter(function(it){ return it.category===cat; }).length;
      shopping.categories = shopping.categories.filter(function(c){ return c!==cat; });
      writeShopping(shopping);
      showToast(affected > 0 ? ("✓ 已刪除類別，"+affected+" 個項目移到「其他分類」") : "✓ 已刪除類別");
    }
  });

  // Typing into a text/time field fires "input" once per keystroke. Re-rendering
  // the whole app on every keystroke (the old behaviour) replaces the input's DOM
  // node mid-type, which drops focus and — on a phone — dismisses the keyboard.
  // So "input" events only update the in-memory data + schedule a debounced
  // save; nothing re-renders until the person pauses. Discrete controls
  // (select/checkbox) still apply and re-render immediately since there's no
  // continuous typing to interrupt there.
  var dayDebTimers = {};
  var tplDebTimers = {};

  document.getElementById("app").addEventListener("input", function(e){
    handleFieldChange(e.target, true);
  });
  document.getElementById("app").addEventListener("change", function(e){
    if(e.target.tagName==="SELECT") handleFieldChange(e.target, false);
  });

  function applyDayChange(dateStr, day, debounced){
    if(!debounced){ writeDay(dateStr, day); return; }
    state.dayCache[dateStr] = day;
    clearTimeout(dayDebTimers[dateStr]);
    dayDebTimers[dateStr] = setTimeout(function(){ writeDay(dateStr, day); }, 500);
  }
  function applyTplChange(wd, tpl, debounced){
    if(!debounced){ writeTemplate(wd, tpl); return; }
    state.templates[wd] = tpl;
    clearTimeout(tplDebTimers[wd]);
    tplDebTimers[wd] = setTimeout(function(){ writeTemplate(wd, tpl); }, 500);
  }

  function handleFieldChange(el, debounced){
    var action = el.dataset.action;
    if(!action) return;
    if(isViewOnly()) return; // every field-change action writes data; viewers never do

    if(action==="commute-field"){
      var dateStr = el.dataset.date, person = el.dataset.person, field = el.dataset.field;
      var day = getEffectiveDay(dateStr);
      day.commute[person][field] = el.value;
      applyDayChange(dateStr, day, debounced);
    } else if(action==="baby-field"){
      var dateStr = el.dataset.date, ev = el.dataset.event, field = el.dataset.field;
      var day = getEffectiveDay(dateStr);
      day.baby[ev][field] = el.value;
      applyDayChange(dateStr, day, debounced);
    } else if(action==="vehicle-field"){
      // Deliberately not saved/rendered here — see the comment above
      // vehicleRowHtml(). The one exception is the "who" dropdown, which
      // needs the "是誰" text box to appear/disappear as soon as "其他" is
      // picked; that's a pure DOM tweak with no data write, so it's safe to
      // do immediately without touching state or re-rendering the page.
      if(el.dataset.field==="who") toggleVehicleCustomLabel(el);
    } else if(action==="shopping-field"){
      // Same deliberate no-op as vehicle-field above — a shopping row's
      // fields (including the native date picker for "due") are only read
      // once, at confirm time; see shopping-confirm/shopping-draft-confirm.
    } else if(action==="chore-field"){
      var dateStr = el.dataset.date, id = el.dataset.id, field = el.dataset.field;
      var day = getEffectiveDay(dateStr);
      day.chores = day.chores.map(function(c){
        if(c.id!==id) return c;
        var nc = Object.assign({}, c);
        nc[field] = el.value;
        return nc;
      });
      applyDayChange(dateStr, day, debounced);
    } else if(action==="tpl-commute-field"){
      var wd = Number(el.dataset.weekday), person = el.dataset.person, field = el.dataset.field;
      var tpl = normalizeTemplate(state.templates[wd]);
      tpl.commute[person][field] = el.value;
      applyTplChange(wd, tpl, debounced);
    } else if(action==="tpl-baby-field"){
      var wd = Number(el.dataset.weekday), ev = el.dataset.event, field = el.dataset.field;
      var tpl = normalizeTemplate(state.templates[wd]);
      tpl.baby[ev][field] = el.value;
      applyTplChange(wd, tpl, debounced);
    } else if(action==="tpl-chore-field"){
      var wd = Number(el.dataset.weekday), id = el.dataset.id, field = el.dataset.field;
      var tpl = normalizeTemplate(state.templates[wd]);
      tpl.chores = tpl.chores.map(function(c){
        if(c.id!==id) return c;
        var nc = Object.assign({}, c);
        nc[field] = el.value;
        return nc;
      });
      applyTplChange(wd, tpl, debounced);
    }
  }

  render();
})();
</script>
</body>
</html>
